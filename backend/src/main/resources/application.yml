server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: export-flow
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:export_flow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:export_flow}
    password: ${MYSQL_PASSWORD:export_flow}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:export_flow}
    password: ${RABBITMQ_PASSWORD:export_flow}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: ${EXPORT_CONSUMER_PREFETCH:1}
        concurrency: ${EXPORT_CONSUMER_CONCURRENCY:2}
        max-concurrency: ${EXPORT_CONSUMER_MAX_CONCURRENCY:2}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  seed:
    orders: 0
  export:
    max-filter-rows: 1000000
    max-selected-rows: 5000
    query-batch-size: 1000
    sxssf-row-window: 500
    count-timeout-seconds: 5
    max-auto-attempts: 3
    max-manual-retries: 2
    heartbeat-interval: 10s
    stale-after: 60s
    recovery-interval: 30s
    retry-delay: 15s
    outbox-interval: 1s
    file-retention: 24h
    cleanup-interval: 1h
    storage-root: ${EXPORT_STORAGE_ROOT:./data/exports}
    minimum-free-space-bytes: 1073741824

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}] [taskId:%X{taskId:-}]"
